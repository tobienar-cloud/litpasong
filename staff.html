<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#9a0c1d">
<link rel="icon" href="img/app/favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ພະນັກງານ">
<title>ມອບຄຳ · ພະນັກງານ ລິດປະສົງ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;600;800&family=Noto+Serif+Lao:wght@700;800&display=swap">
<style>
:root{
  --maroon:#c8142a; --deep:#9a0c1d; --gold:#f0b92b; --gold-soft:#ffe27a;
  --bg:#fff9f5; --surface:#fff; --fg:#2a1a1c; --muted:#76615f; --line:#f1dcd3;
  --good:#1f6b2c; --good-bg:#e3f1e4; --warn:#8a5a00; --warn-bg:#fbefd2; --bad:#8a2020; --bad-bg:#f4e3e3;
  --display:"Noto Serif Lao","Noto Sans Lao Looped",serif;
  --body:"Noto Sans Lao Looped","Noto Sans Lao",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
header{background:linear-gradient(160deg,var(--maroon),var(--deep));color:#fbf1df;border-bottom:3px solid var(--gold);padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-top:16px;padding-bottom:14px;display:flex;align-items:center;gap:12px;justify-content:space-between}
header img{width:44px;height:44px;border-radius:50%}
h1{font-family:var(--display);font-size:22px;margin:0;color:#f6dc8f;line-height:1.3}
header small{display:block;font-size:14px;color:#fbe6c0}
main{display:grid;gap:14px;padding-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
label{font-weight:600}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--fg);letter-spacing:.04em}
input:focus{outline:none;border-color:var(--gold)}
.btn{appearance:none;border:0;border-radius:12px;font:inherit;font-weight:800;font-size:18px;padding:14px 16px;cursor:pointer;width:100%;background:var(--gold);color:var(--deep)}
.btn.maroon{background:var(--maroon);color:#fff3d6}
.btn.line{background:transparent;border:2px solid var(--maroon);color:var(--maroon)}
.btn.big{font-size:21px;padding:18px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.link{background:none;border:0;color:#ffe27a;font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.note{font-size:14px;color:var(--muted);margin:0}
.msg{border-radius:12px;padding:12px 14px;font-weight:600}
.msg.bad{background:var(--bad-bg);color:var(--bad)}.msg.good{background:var(--good-bg);color:var(--good)}.msg.warn{background:var(--warn-bg);color:var(--warn)}
#cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1/1}
#cam video{width:100%;height:100%;object-fit:cover;display:block}
#cam .frame{position:absolute;inset:18%;border:3px solid var(--gold);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.pill{display:inline-block;justify-self:start;border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px}
.pill.ready{background:var(--good-bg);color:var(--good)}.pill.done{background:#e6e1f5;color:#3b2f7a}.pill.wait{background:var(--warn-bg);color:var(--warn)}.pill.off{background:var(--bad-bg);color:var(--bad)}
.who{display:flex;gap:14px;align-items:center}
.who img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:2px solid var(--line);background:#f4ece6}
.who .nm{font-size:21px;font-weight:800;line-height:1.35}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{color:var(--muted)}dd{margin:0;font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
dd.big{font-size:20px;color:var(--maroon)}
.checks{display:grid;gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;background:#fff5dc;border:1px solid var(--gold);border-radius:12px;padding:12px;font-weight:600;cursor:pointer}
.check input{width:26px;height:26px;margin:2px 0 0;accent-color:var(--maroon);flex:none}
.done-box{text-align:center;display:grid;gap:6px;padding:22px 16px;background:var(--good-bg);color:var(--good);border-radius:14px}
.done-box b{font-size:26px;font-family:var(--display)}
</style>
</head>
<body>
<header><div class="wrap">
  <div style="display:flex;gap:12px;align-items:center"><img src="img/logo-round.png" alt=""><div><h1>ມອບຄຳໃຫ້ລູກຄ້າ</h1><small id="who-staff">ສຳລັບພະນັກງານຮ້ານ</small></div></div>
  <button class="link" id="logout" hidden>ອອກຈາກລະບົບ</button>
</div></header>

<div class="wrap"><main>
  <!-- ໃສ່ລະຫັດພະນັກງານ -->
  <section class="card" id="v-login">
    <label for="pin">ລະຫັດພະນັກງານ</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••••">
    <label class="check" style="background:none;border:0;padding:0"><input type="checkbox" id="remember" checked> ຈື່ລະຫັດໄວ້ໃນເຄື່ອງນີ້ (ເຄື່ອງຂອງຮ້ານເທົ່ານັ້ນ)</label>
    <div id="login-err" class="msg bad" hidden></div>
    <button class="btn maroon" id="login-btn">ເຂົ້າໃຊ້ງານ</button>
  </section>

  <!-- ສະແກນ ຫຼື ພິມເລກບິນ -->
  <section id="v-scan" hidden style="display:grid;gap:14px">
    <button class="btn big" id="scan-btn">📷 ສະແກນ QR ໃບຈອງ</button>
    <div id="cam" hidden><video id="video" playsinline muted></video><div class="frame"></div></div>
    <button class="btn line" id="scan-stop" hidden>ປິດກ້ອງ</button>
    <div class="card">
      <label for="bill">ຫຼື ພິມເລກບິນ</label>
      <div class="row"><input id="bill" type="text" autocapitalize="characters" placeholder="LPS-20261128-0001" style="flex:2"><button class="btn maroon" id="find-btn" style="flex:1">ຄົ້ນຫາ</button></div>
      <p class="note">ເລກບິນຢູ່ໃຕ້ QR ໃນໃບຈອງຂອງລູກຄ້າ</p>
    </div>
    <div id="scan-err" class="msg bad" hidden></div>
  </section>

  <!-- ລາຍລະອຽດບິນ -->
  <section class="card" id="v-order" hidden>
    <span class="pill" id="o-pill"></span>
    <div id="o-state" class="msg" hidden></div>
    <div class="who"><img id="o-photo" alt="ຮູບລູກຄ້າ" hidden><div><div class="nm" id="o-name"></div><div class="note" id="o-bill"></div></div></div>
    <dl>
      <dt>ວັນເກີດ</dt><dd id="o-dob"></dd>
      <dt>ເບີໂທ</dt><dd id="o-phone"></dd>
      <dt>ທີ່ຢູ່</dt><dd id="o-addr"></dd>
      <dt>ລາຍການ</dt><dd id="o-item"></dd>
      <dt>ນ້ຳໜັກ</dt><dd id="o-grams"></dd>
      <dt>ໂອນແລ້ວ</dt><dd class="big" id="o-total"></dd>
      <dt>ຢືນຢັນເງິນ</dt><dd id="o-paid"></dd>
      <dt>ນັດມາຮັບ</dt><dd id="o-appt"></dd>
      <dt id="o-note-k">ໝາຍເຫດ</dt><dd id="o-note"></dd>
    </dl>
    <div class="checks" id="o-checks">
      <label class="check"><input type="checkbox" class="ck"> ກວດບັດປະຈຳຕົວແລ້ວ ຊື່ ແລະ ວັນເກີດ ຕົງກັບບິນ</label>
      <label class="check"><input type="checkbox" class="ck"> ກວດນ້ຳໜັກ ແລະ ລາຍການຄຳ ຕົງກັບບິນ</label>
      <label class="check" id="ck-lai"><input type="checkbox" class="ck"> ເກັບຄ່າລາຍທີ່ຮ້ານແລ້ວ (ຄຳຮູບປະພັນ)</label>
    </div>
    <div id="pick-err" class="msg bad" hidden></div>
    <button class="btn big maroon" id="pick-btn" disabled>ມອບຄຳແລ້ວ</button>
    <button class="btn line" id="next-btn">ສະແກນບິນອື່ນ</button>
  </section>

  <section id="v-done" hidden style="display:grid;gap:14px">
    <div class="done-box"><b>✓ ມອບຄຳສຳເລັດ</b><span id="d-text"></span></div>
    <button class="btn big" id="done-next">📷 ສະແກນບິນຕໍ່ໄປ</button>
  </section>
</main></div>

<script src="js/jsQR.js"></script>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwZGKzQiZDxkUevDo-4PY_Xt5TtnErjBkAryQ8Sb8N1cwv67FImKLI7E33VxF4jfO361g/exec';
const $ = id => document.getElementById(id);
const ST = { READY: 'ຈ່າຍແລ້ວ ພ້ອມຮັບ', DONE: 'ຮັບຄຳແລ້ວ', WAIT_PAY: 'ລໍຖ້າໂອນເງິນ', WAIT_CHECK: 'ລໍຖ້າກວດເງິນ', SOLD: 'ຂາຍຄືນໃຫ້ຮ້ານ' };
let PIN = '', ORDER = null, stream = null, armed = false;
const store = { get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }, set(k,v){ try { v ? localStorage.setItem(k,v) : localStorage.removeItem(k); } catch(e){} } };

async function post(params) {
  const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(Object.assign({ pin: PIN }, params)) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'ເກີດຂໍ້ຜິດພາດ');
  return j;
}
function show(id) { ['v-login','v-scan','v-order','v-done'].forEach(v => $(v).hidden = v !== id); window.scrollTo(0,0); }
function err(id, t) { $(id).textContent = t || ''; $(id).hidden = !t; }
function billFrom(text) { const m = /LPS-\d{8}-\d{4}/i.exec(String(text || '')); return m ? m[0].toUpperCase() : ''; }
const kip = n => Number(n || 0).toLocaleString('en-US') + ' ກີບ';
const grams = g => (Math.round(Number(g) * 1000) / 1000) + ' ກຣາມ';

async function login(pin, silent) {
  PIN = pin; err('login-err');
  $('login-btn').disabled = true;
  try {
    const j = await post({ action: 'staff_lookup' });
    $('who-staff').textContent = 'ພະນັກງານ: ' + j.staff;
    $('logout').hidden = false;
    if ($('remember').checked) store.set('lps_staff_pin', pin);
    const b = billFrom(location.hash);
    if (b) lookup(b); else show('v-scan');
  } catch (e) {
    PIN = ''; store.set('lps_staff_pin', '');
    show('v-login'); if (!silent) err('login-err', e.message);
  } finally { $('login-btn').disabled = false; }
}
$('login-btn').onclick = () => login($('pin').value.trim());
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-btn').click(); });
$('logout').onclick = () => { store.set('lps_staff_pin',''); PIN=''; $('pin').value=''; $('logout').hidden=true; $('who-staff').textContent='ສຳລັບພະນັກງານຮ້ານ'; stopCam(); show('v-login'); };

async function lookup(bill) {
  stopCam(); err('scan-err');
  if (!bill) return err('scan-err', 'ບໍ່ພົບເລກບິນ ກວດອີກຄັ້ງ (ຕົວຢ່າງ LPS-20261128-0001)');
  $('find-btn').disabled = true;
  try { const j = await post({ action: 'staff_lookup', bill }); render(j.order); }
  catch (e) { show('v-scan'); err('scan-err', e.message); }
  finally { $('find-btn').disabled = false; }
}
$('find-btn').onclick = () => lookup(billFrom($('bill').value));
$('bill').addEventListener('keydown', e => { if (e.key === 'Enter') $('find-btn').click(); });

function render(o) {
  ORDER = o; armed = false;
  const ready = o.status === ST.READY, done = o.status === ST.DONE;
  $('o-pill').textContent = o.status;
  $('o-pill').className = 'pill ' + (ready ? 'ready' : done ? 'done' : (o.status === ST.WAIT_PAY || o.status === ST.WAIT_CHECK) ? 'wait' : 'off');
  const state = done ? ['bad', 'ບິນນີ້ມອບຄຳໄປແລ້ວ ເມື່ອ ' + (o.doneAt || '—') + ' ຫ້າມມອບຊ້ຳ']
    : o.status === ST.WAIT_CHECK ? ['warn', 'ແອັດມິນຍັງບໍ່ໄດ້ຢືນຢັນເງິນ ຍັງມອບຄຳບໍ່ໄດ້ ແຈ້ງແອັດມິນໃຫ້ກວດເງິນກ່ອນ']
    : o.status === ST.WAIT_PAY ? ['warn', 'ລູກຄ້າຍັງບໍ່ໄດ້ໂອນເງິນ ຍັງມອບຄຳບໍ່ໄດ້']
    : !ready ? ['bad', 'ບິນນີ້ມອບຄຳບໍ່ໄດ້ (ສະຖານະ: ' + o.status + ')'] : null;
  $('o-state').hidden = !state; if (state) { $('o-state').className = 'msg ' + state[0]; $('o-state').textContent = state[1]; }
  $('o-photo').hidden = !o.photo; if (o.photo) $('o-photo').src = o.photo;
  $('o-name').textContent = o.name || '—';
  $('o-bill').textContent = 'ເລກບິນ ' + o.bill + ' · ສັ່ງ ' + (o.created || '');
  $('o-dob').textContent = o.dob || '—';
  $('o-phone').textContent = o.phone || '—';
  $('o-addr').textContent = o.address || '—';
  $('o-item').textContent = o.item + ' × ' + o.qty;
  $('o-grams').textContent = grams(o.grams);
  $('o-total').textContent = kip(o.total);
  $('o-paid').textContent = o.paidAt || 'ຍັງບໍ່ໄດ້ຢືນຢັນ';
  $('o-appt').textContent = o.appt || 'ບໍ່ໄດ້ນັດ';
  $('o-note').textContent = o.note || ''; $('o-note').hidden = $('o-note-k').hidden = !o.note;
  $('ck-lai').hidden = !o.jewelry;
  document.querySelectorAll('.ck').forEach(c => { c.checked = false; c.disabled = !ready; });
  $('o-checks').hidden = !ready; $('pick-btn').hidden = !ready;
  $('pick-btn').textContent = 'ມອບຄຳແລ້ວ';
  err('pick-err'); updateBtn(); show('v-order');
}
function updateBtn() {
  const need = [...document.querySelectorAll('.ck')].filter(c => !c.closest('.check').hidden);
  $('pick-btn').disabled = !need.every(c => c.checked);
  armed = false; $('pick-btn').textContent = 'ມອບຄຳແລ້ວ';
}
document.querySelectorAll('.ck').forEach(c => c.addEventListener('change', updateBtn));

$('pick-btn').onclick = async () => {
  if (!armed) { armed = true; $('pick-btn').textContent = 'ກົດອີກເທື່ອ ເພື່ອຢືນຢັນມອບຄຳ'; return; }
  $('pick-btn').disabled = true; err('pick-err');
  try {
    const j = await post({ action: 'staff_pickup', bill: ORDER.bill });
    $('d-text').textContent = j.order.bill + ' · ' + j.order.name + ' · ' + j.order.item + ' × ' + j.order.qty + ' · ' + (j.order.doneAt || '');
    history.replaceState(null, '', location.pathname);
    show('v-done');
  } catch (e) { err('pick-err', e.message); $('pick-btn').disabled = false; armed = false; $('pick-btn').textContent = 'ມອບຄຳແລ້ວ'; }
};
const again = () => { history.replaceState(null, '', location.pathname); $('bill').value = ''; show('v-scan'); startCam(); };
$('next-btn').onclick = () => { history.replaceState(null, '', location.pathname); $('bill').value=''; show('v-scan'); };
$('done-next').onclick = again;

// ---- ກ້ອງ ສະແກນ QR ----
async function startCam() {
  err('scan-err');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return err('scan-err', 'ເຄື່ອງນີ້ເປີດກ້ອງໃນໜ້າເວັບບໍ່ໄດ້ ໃຫ້ພິມເລກບິນແທນ ຫຼື ສະແກນດ້ວຍແອັບກ້ອງຂອງໂທລະສັບ');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  } catch (e) { return err('scan-err', 'ເປີດກ້ອງບໍ່ໄດ້ ກະລຸນາອະນຸຍາດໃຫ້ໃຊ້ກ້ອງ ຫຼື ພິມເລກບິນແທນ'); }
  const v = $('video'); v.srcObject = stream; await v.play();
  $('cam').hidden = false; $('scan-stop').hidden = false; $('scan-btn').hidden = true;
  const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
  const tick = () => {
    if (!stream) return;
    if (v.readyState === v.HAVE_ENOUGH_DATA) {
      const w = 480, h = Math.round(v.videoHeight / v.videoWidth * w) || 480;
      c.width = w; c.height = h; ctx.drawImage(v, 0, 0, w, h);
      const code = window.jsQR && jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
      if (code && code.data) {
        const b = billFrom(code.data);
        if (b) { if (navigator.vibrate) navigator.vibrate(80); $('bill').value = b; return lookup(b); }
        err('scan-err', 'QR ນີ້ບໍ່ແມ່ນໃບຈອງຂອງຮ້ານ');
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function stopCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; $('cam').hidden = true; $('scan-stop').hidden = true; $('scan-btn').hidden = false;
}
$('scan-btn').onclick = startCam;
$('scan-stop').onclick = stopCam;
window.addEventListener('hashchange', () => { const b = billFrom(location.hash); if (b && PIN) lookup(b); });

const saved = store.get('lps_staff_pin');
if (saved) { $('pin').value = saved; login(saved, true); } else show('v-login');
</script>
</body>
</html>
